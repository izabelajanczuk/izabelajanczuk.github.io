<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Izabela Janczuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,100..600,0..1&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="grain"></div>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">I.J.</a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav class="nav">
        <a href="projects.html">Work</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Images</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <div class="wrap">
      <div class="contact-head">
        <h1 class="page-display">Get in touch</h1>
        <p class="page-lead">Open to collaborations, internships, and conversations.</p>
      </div>

      <form id="contact-form" class="form">
        <div class="name-row">
          <div class="field">
            <label for="firstName">First name <span class="req">(required)</span></label>
            <input id="firstName" name="firstName" type="text" required />
          </div>
          <div class="field">
            <label for="lastName">Last name <span class="req">(required)</span></label>
            <input id="lastName" name="lastName" type="text" required />
          </div>
        </div>

        <div class="field">
          <label for="email">Email <span class="req">(required)</span></label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="message">Message <span class="req">(required)</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button class="btn-send" type="submit">Send</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="footer-wordmark">I.J.</span>
      <div class="footer-meta">
        Seattle, WA<br>
        Design · Environment · Objects · Images<br>
        <a href="https://www.linkedin.com/in/izabela-janczuk/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/maqgadkk";
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending…";
      try {
        const res = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form),
        });
        if (res.ok) {
          form.reset();
          status.textContent = "Thank you — your message has been sent.";
        } else {
          status.textContent = "Something went wrong — please try again in a moment.";
        }
      } catch {
        status.textContent = "Couldn't send right now — please check your connection.";
      }
    });
  </script>
</body>
</html>
